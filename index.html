<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#03090d" />
  <title>Hand Holo Lab</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="threeCanvas" aria-hidden="true"></canvas>
    <canvas id="fxCanvas" aria-hidden="true"></canvas>

    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="topbar hud-panel">
      <div>
        <div class="eyebrow">HAND // HOLO LAB</div>
        <div id="status" class="status"><span class="status-dot"></span>等待啟動</div>
      </div>
      <button id="flipBtn" class="icon-btn" type="button" title="切換前後鏡頭" disabled>↻</button>
    </header>

    <section class="left-hud hud-panel" aria-live="polite">
      <div class="hud-label">GESTURE</div>
      <div id="gesture" class="gesture">—</div>
      <div id="gestureZh" class="gesture-zh">把手放進畫面</div>
      <div class="meter-row">
        <span>CONF</span>
        <div class="meter"><i id="confidenceBar"></i></div>
        <span id="confidence">0%</span>
      </div>
      <div class="mini-grid">
        <span>HAND</span><b id="handedness">—</b>
        <span>FPS</span><b id="fps">0</b>
        <span>PINCH</span><b id="pinchValue">0.00</b>
      </div>
    </section>

    <section class="tips hud-panel">
      <div class="hud-label">TRY THESE</div>
      <div class="tip-row"><span>🤏</span><b>捏合</b><small>能量核心</small></div>
      <div class="tip-row"><span>✊</span><b>握拳</b><small>粒子收束</small></div>
      <div class="tip-row"><span>✋</span><b>張手</b><small>粒子爆散</small></div>
      <div class="tip-row"><span>✌️</span><b>Victory</b><small>雙環模式</small></div>
      <div class="tip-row"><span>🤏💨</span><b>捏合甩開</b><small>丟出光球</small></div>
      <div class="tip-row"><span>👋💨</span><b>快速揮手</b><small>宇宙模式</small></div>
    </section>

    <div id="toast" class="toast" role="status"></div>

    <section id="startPanel" class="start-panel">
      <div class="start-card">
        <div class="logo-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="eyebrow">MOBILE CAMERA + MEDIAPIPE + THREE.JS</p>
        <h1>用手召喚<br><em>科幻 HUD</em></h1>
        <p class="desc">相機畫面只在裝置上做即時辨識。第一次啟動會下載 MediaPipe 模型，請保持網路連線。</p>
        <button id="startBtn" class="start-btn" type="button">啟動相機</button>
        <p id="secureHint" class="secure-hint"></p>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
